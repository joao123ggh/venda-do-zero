<svg viewBox="0 0 640 640" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#181818"/>
      <stop offset="100%" stop-color="#0e0e0e"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff8a3d"/>
      <stop offset="100%" stop-color="#ff5e1a"/>
    </linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c88a4f"/>
      <stop offset="100%" stop-color="#a56a34"/>
    </linearGradient>
  </defs>

  <rect width="640" height="640" rx="28" fill="url(#bg)"/>

  <!-- glow -->
  <circle cx="320" cy="300" r="230" fill="#ff5e1a" opacity="0.08"/>

  <!-- caixa de encomenda -->
  <g transform="translate(120,380)">
    <rect x="0" y="40" width="180" height="130" rx="6" fill="url(#box)"/>
    <rect x="0" y="40" width="180" height="28" fill="#8a5a2e"/>
    <path d="M0 40 L90 0 L180 40" fill="none" stroke="#e0e0e0" stroke-width="4" opacity="0.5"/>
    <line x1="90" y1="40" x2="90" y2="170" stroke="#5c3a1c" stroke-width="4"/>
    <rect x="60" y="60" width="60" height="16" fill="#ff8a3d" opacity="0.9"/>
  </g>

  <!-- smartphone -->
  <g transform="translate(300,150)">
    <rect x="0" y="0" width="220" height="400" rx="32" fill="#232323" stroke="#3a3a3a" stroke-width="3"/>
    <rect x="12" y="30" width="196" height="340" rx="10" fill="#101010"/>
    <circle cx="110" cy="16" r="4" fill="#555"/>

    <!-- tela: notificação de venda -->
    <rect x="26" y="60" width="168" height="80" rx="14" fill="url(#orange)"/>
    <text x="110" y="92" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#141414" text-anchor="middle">VENDA</text>
    <text x="110" y="114" font-family="Arial, sans-serif" font-size="13" fill="#141414" text-anchor="middle">CONFIRMADA ✓</text>

    <!-- linhas de gráfico crescente -->
    <polyline points="40,300 75,270 105,285 140,235 175,190" fill="none" stroke="#ff8a3d" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="175" cy="190" r="7" fill="#ff5e1a"/>

    <text x="110" y="335" font-family="Arial, sans-serif" font-size="12" fill="#9c9c9c" text-anchor="middle">Shopee · Mercado Livre</text>
  </g>

  <!-- estrelinhas / faíscas de destaque -->
  <g fill="#ff8a3d">
    <circle cx="480" cy="140" r="5"/>
    <circle cx="510" cy="180" r="3"/>
    <circle cx="150" cy="120" r="4"/>
  </g>

  <!-- selo de moeda / cifrão -->
  <g transform="translate(450,380)">
    <circle cx="0" cy="0" r="46" fill="url(#orange)"/>
    <text x="0" y="12" font-family="Arial, sans-serif" font-size="42" font-weight="bold" fill="#141414" text-anchor="middle">R$</text>
  </g>
</svg>
