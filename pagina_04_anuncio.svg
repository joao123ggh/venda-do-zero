<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 700" width="100%" height="100%">
  <defs>
    <linearGradient id="p4Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141720"/>
      <stop offset="100%" stop-color="#0E1017"/>
    </linearGradient>
  </defs>

  <rect width="500" height="700" rx="12" fill="url(#p4Bg)" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>

  <!-- Top Header -->
  <g transform="translate(40, 45)">
    <text x="0" y="0" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#FF6B00" letter-spacing="1">MÓDULO 04 • ANÚNCIOS DE CONVERSÃO</text>
    <text x="420" y="0" text-anchor="end" font-family="'Inter', sans-serif" font-size="11" fill="#777">PÁGINA 36</text>
    <line x1="0" y1="12" x2="420" y2="12" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  </g>

  <!-- Title -->
  <g transform="translate(40, 85)">
    <text x="0" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="800" fill="#FFF">Como Criar um Anúncio</text>
    <text x="0" y="48" font-family="'Inter', sans-serif" font-size="12" fill="#8892B0">A anatomia do anúncio perfeito que passa credibilidade e aparece nas buscas.</text>
  </g>

  <!-- Step 1: Title Formula -->
  <g transform="translate(40, 160)">
    <rect width="420" height="85" rx="8" fill="#1A1E29" stroke="rgba(255,107,0,0.2)"/>
    <text x="16" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#FF8A3D">A FÓRMULA DO TÍTULO MATADOR</text>
    <rect x="16" y="36" width="388" height="34" rx="4" fill="#12141C"/>
    <text x="26" y="58" font-family="'Inter', sans-serif" font-size="11" fill="#FFF">
      [Produto Principal] + [Característica / Modelo] + [Benefício / Cor / Tamanho]
    </text>
  </g>

  <!-- Step 2: 5 Photos Rule -->
  <g transform="translate(40, 260)">
    <rect width="420" height="150" rx="8" fill="#1A1E29" stroke="rgba(255,255,255,0.06)"/>
    <text x="16" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#FFF">AS 4 FOTOS ESSENCIAIS TIRADAS PELO CELULAR</text>
    
    <!-- 4 Photo Placeholders -->
    <g transform="translate(16, 42)">
      <!-- Photo 1 -->
      <rect width="88" height="80" rx="6" fill="#12141C" stroke="rgba(255,255,255,0.05)"/>
      <text x="44" y="36" text-anchor="middle" font-size="16">📸</text>
      <text x="44" y="58" text-anchor="middle" font-family="'Inter', sans-serif" font-size="9" fill="#FFF" font-weight="600">Foto 1: Capa</text>
      <text x="44" y="70" text-anchor="middle" font-family="'Inter', sans-serif" font-size="8" fill="#777">Fundo Claro</text>

      <!-- Photo 2 -->
      <g transform="translate(98, 0)">
        <rect width="88" height="80" rx="6" fill="#12141C" stroke="rgba(255,255,255,0.05)"/>
        <text x="44" y="36" text-anchor="middle" font-size="16">📐</text>
        <text x="44" y="58" text-anchor="middle" font-family="'Inter', sans-serif" font-size="9" fill="#FFF" font-weight="600">Foto 2: Medidas</text>
        <text x="44" y="70" text-anchor="middle" font-family="'Inter', sans-serif" font-size="8" fill="#777">Com escala</text>
      </g>

      <!-- Photo 3 -->
      <g transform="translate(196, 0)">
        <rect width="88" height="80" rx="6" fill="#12141C" stroke="rgba(255,255,255,0.05)"/>
        <text x="44" y="36" text-anchor="middle" font-size="16">🖐️</text>
        <text x="44" y="58" text-anchor="middle" font-family="'Inter', sans-serif" font-size="9" fill="#FFF" font-weight="600">Foto 3: Uso</text>
        <text x="44" y="70" text-anchor="middle" font-family="'Inter', sans-serif" font-size="8" fill="#777">Na mão</text>
      </g>

      <!-- Photo 4 -->
      <g transform="translate(294, 0)">
        <rect width="88" height="80" rx="6" fill="#12141C" stroke="rgba(255,255,255,0.05)"/>
        <text x="44" y="36" text-anchor="middle" font-size="16">📦</text>
        <text x="44" y="58" text-anchor="middle" font-family="'Inter', sans-serif" font-size="9" fill="#FFF" font-weight="600">Foto 4: Pacote</text>
        <text x="44" y="70" text-anchor="middle" font-family="'Inter', sans-serif" font-size="8" fill="#777">O que recebe</text>
      </g>
    </g>
  </g>

  <!-- Step 3: Clear Description Template -->
  <g transform="translate(40, 425)">
    <rect width="420" height="190" rx="8" fill="#151822" stroke="rgba(255,255,255,0.05)"/>
    <text x="20" y="28" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#FF8A3D">MODELO DE DESCRIÇÃO RÁPIDA:</text>
    <g transform="translate(20, 44)" font-family="'Inter', sans-serif" font-size="11" fill="#CAD2E0">
      <text x="0" y="16">1. Parágrafo introdutório direto ao ponto (o que resolve).</text>
      <text x="0" y="38">2. Lista de especificações em tópicos (material, cor, peso).</text>
      <text x="0" y="60">3. Itens inclusos no pacote ("Você receberá: 01 unidade...").</text>
      <text x="0" y="82">4. Prazos e política de postagem rápida (gera confiança imediata).</text>
      <text x="0" y="104">5. Seção tira-dúvidas rápida com as 3 perguntas mais frequentes.</text>
    </g>
  </g>

  <!-- Footer -->
  <g transform="translate(40, 640)">
    <line x1="0" y1="0" x2="420" y2="0" stroke="rgba(255,255,255,0.08)"/>
    <text x="0" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#FFF">VENDA DO <tspan fill="#FF6B00">ZERO</tspan></text>
    <text x="420" y="24" text-anchor="end" font-family="'Inter', sans-serif" font-size="10" fill="#666">GUIA PRÁTICO • SHOPEE &amp; MERCADO LIVRE</text>
  </g>
</svg>
