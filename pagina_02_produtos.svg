<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 700" width="100%" height="100%">
  <defs>
    <linearGradient id="p2Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141720"/>
      <stop offset="100%" stop-color="#0E1017"/>
    </linearGradient>
  </defs>

  <rect width="500" height="700" rx="12" fill="url(#p2Bg)" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>

  <!-- Top Header -->
  <g transform="translate(40, 45)">
    <text x="0" y="0" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#FF6B00" letter-spacing="1">MÓDULO 02 • ESCOLHA DE PRODUTOS</text>
    <text x="420" y="0" text-anchor="end" font-family="'Inter', sans-serif" font-size="11" fill="#777">PÁGINA 14</text>
    <line x1="0" y1="12" x2="420" y2="12" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  </g>

  <!-- Title -->
  <g transform="translate(40, 85)">
    <text x="0" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="800" fill="#FFF">Como Escolher Seu Primeiro Produto</text>
    <text x="0" y="48" font-family="'Inter', sans-serif" font-size="12" fill="#8892B0">Critérios práticos para evitar estoque parado e escolher itens com demanda constante.</text>
  </g>

  <!-- Criteria 1 -->
  <g transform="translate(40, 160)">
    <rect width="420" height="85" rx="8" fill="#1A1E29" stroke="rgba(255,107,0,0.2)"/>
    <rect x="16" y="16" width="36" height="36" rx="6" fill="#FF6B00" fill-opacity="0.15"/>
    <text x="34" y="40" text-anchor="middle" font-size="18">🔍</text>
    <text x="64" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#FFF">1. Validação de Demanda Real</text>
    <text x="64" y="50" font-family="'Inter', sans-serif" font-size="11" fill="#8892B0">Pesquise termos mais buscados na barra de pesquisa da Shopee e Mercado Livre para identificar o que as pessoas já estão comprando.</text>
  </g>

  <!-- Criteria 2 -->
  <g transform="translate(40, 260)">
    <rect width="420" height="85" rx="8" fill="#1A1E29" stroke="rgba(255,255,255,0.06)"/>
    <rect x="16" y="16" width="36" height="36" rx="6" fill="#FF8A3D" fill-opacity="0.15"/>
    <text x="34" y="40" text-anchor="middle" font-size="18">📦</text>
    <text x="64" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#FFF">2. Peso e Dimensões Fáceis de Enviar</text>
    <text x="64" y="50" font-family="'Inter', sans-serif" font-size="11" fill="#8892B0">Dê preferência a produtos pequenos e leves (até 500g). Frete mais barato e manuseio simples reduzem custos e riscos operacionais.</text>
  </g>

  <!-- Criteria 3 -->
  <g transform="translate(40, 360)">
    <rect width="420" height="85" rx="8" fill="#1A1E29" stroke="rgba(255,255,255,0.06)"/>
    <rect x="16" y="16" width="36" height="36" rx="6" fill="#FF6B00" fill-opacity="0.15"/>
    <text x="34" y="40" text-anchor="middle" font-size="18">⚖️</text>
    <text x="64" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#FFF">3. Margem Segura de Precificação</text>
    <text x="64" y="50" font-family="'Inter', sans-serif" font-size="11" fill="#8892B0">O preço de venda deve cobrir custo do produto, taxas do canal (14% a 20%) e custos de embalagem, mantendo lucro limpo por venda.</text>
  </g>

  <!-- Checklist Box -->
  <g transform="translate(40, 465)">
    <rect width="420" height="135" rx="8" fill="#151822" stroke="rgba(255,255,255,0.05)"/>
    <text x="20" y="28" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#FF8A3D">CHECKLIST DO PRODUTO INICIAL:</text>
    <g transform="translate(20, 42)" font-family="'Inter', sans-serif" font-size="11" fill="#CAD2E0">
      <text x="0" y="16"><tspan fill="#FF6B00" font-weight="bold">✓</tspan> Não quebra com facilidade no transporte.</text>
      <text x="0" y="38"><tspan fill="#FF6B00" font-weight="bold">✓</tspan> Não possui prazo de validade curto.</text>
      <text x="0" y="60"><tspan fill="#FF6B00" font-weight="bold">✓</tspan> Fácil de fotografar e demonstrar em vídeos rápidos.</text>
      <text x="0" y="82"><tspan fill="#FF6B00" font-weight="bold">✓</tspan> Possui pelo menos 3 concorrentes vendendo regularmente.</text>
    </g>
  </g>

  <!-- Footer -->
  <g transform="translate(40, 640)">
    <line x1="0" y1="0" x2="420" y2="0" stroke="rgba(255,255,255,0.08)"/>
    <text x="0" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#FFF">VENDA DO <tspan fill="#FF6B00">ZERO</tspan></text>
    <text x="420" y="24" text-anchor="end" font-family="'Inter', sans-serif" font-size="10" fill="#666">GUIA PRÁTICO • SHOPEE &amp; MERCADO LIVRE</text>
  </g>
</svg>
