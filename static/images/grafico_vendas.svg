<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 110" width="100%" height="100%">
  <defs>
    <linearGradient id="chartGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF6B00" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#FF6B00" stop-opacity="0.0"/>
    </linearGradient>
    <filter id="chartCardDrop" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <g filter="url(#chartCardDrop)">
    <rect width="160" height="110" rx="12" fill="#181B26" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
    
    <!-- Header -->
    <text x="14" y="22" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#8892B0">PEDIDOS ONLINE</text>
    <text x="14" y="42" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="800" fill="#FFF">+300%</text>
    
    <g transform="translate(92, 14)">
      <rect width="54" height="20" rx="10" fill="rgba(72, 187, 120, 0.15)"/>
      <text x="27" y="14" text-anchor="middle" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#48BB78">Crescendo</text>
    </g>

    <!-- Chart Sparkline Area -->
    <path d="M14 88 L38 78 L65 82 L95 64 L122 68 L146 48 L146 96 L14 96 Z" fill="url(#chartGrad)"/>
    <path d="M14 88 L38 78 L65 82 L95 64 L122 68 L146 48" fill="none" stroke="#FF6B00" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- End dot -->
    <circle cx="146" cy="48" r="4" fill="#FF8A3D" stroke="#FFF" stroke-width="1.5"/>
  </g>
</svg>
