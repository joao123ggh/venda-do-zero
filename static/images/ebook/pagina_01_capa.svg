<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 700" width="100%" height="100%">
  <defs>
    <linearGradient id="p1Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141720"/>
      <stop offset="100%" stop-color="#0E1017"/>
    </linearGradient>
    <linearGradient id="p1Orange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8A3D"/>
      <stop offset="100%" stop-color="#FF6B00"/>
    </linearGradient>
  </defs>

  <rect width="500" height="700" rx="12" fill="url(#p1Bg)" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>

  <!-- Header / Badge -->
  <g transform="translate(40, 50)">
    <rect width="180" height="26" rx="5" fill="#FF6B00" fill-opacity="0.15" stroke="#FF6B00" stroke-width="1"/>
    <text x="12" y="17" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="800" fill="#FF8A3D" letter-spacing="1">GUIA PRÁTICO OFICIAL</text>
  </g>

  <!-- Platforms -->
  <g transform="translate(40, 95)">
    <rect width="90" height="24" rx="4" fill="#EE4D2D" fill-opacity="0.2" stroke="#EE4D2D" stroke-width="1"/>
    <text x="45" y="16" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="800" fill="#FF7A59">SHOPEE</text>
    
    <text x="104" y="16" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#555">+</text>

    <rect x="120" width="125" height="24" rx="4" fill="#FFE600" fill-opacity="0.15" stroke="#FFE600" stroke-width="1"/>
    <text x="182" y="16" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="800" fill="#FFE600">MERCADO LIVRE</text>
  </g>

  <!-- Title -->
  <g transform="translate(40, 160)">
    <text x="0" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="26" font-weight="800" fill="#FFF">FAÇA SUA</text>
    <rect x="-2" y="38" width="380" height="52" rx="6" fill="url(#p1Orange)"/>
    <text x="12" y="75" font-family="'Plus Jakarta Sans', sans-serif" font-size="34" font-weight="900" fill="#FFF">PRIMEIRA VENDA</text>
    <text x="0" y="132" font-family="'Plus Jakarta Sans', sans-serif" font-size="32" font-weight="900" fill="#FFF">DO ZERO</text>
    <line x1="0" y1="150" x2="120" y2="150" stroke="#FF6B00" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Middle Box -->
  <g transform="translate(40, 350)">
    <rect width="420" height="200" rx="10" fill="#1B1E29" stroke="rgba(255,255,255,0.06)"/>
    <text x="24" y="36" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#FFF">Manual Passo a Passo Para Iniciantes</text>
    <text x="24" y="60" font-family="'Inter', sans-serif" font-size="12" fill="#8892B0" width="370">
      <tspan x="24" dy="0">• Escolha de produtos com demanda e margem segura</tspan>
      <tspan x="24" dy="24">• Configuração correta de loja e perfil vendedor</tspan>
      <tspan x="24" dy="24">• Criação de anúncios atraentes com fotos de celular</tspan>
      <tspan x="24" dy="24">• Estratégias de divulgação sem precisar aparecer</tspan>
      <tspan x="24" dy="24">• Rotina simplificada de atendimento e envios</tspan>
    </text>
  </g>

  <!-- Footer Brand -->
  <g transform="translate(40, 620)">
    <line x1="0" y1="0" x2="420" y2="0" stroke="rgba(255,255,255,0.08)"/>
    <text x="0" y="34" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="900" fill="#FFF">VENDA DO <tspan fill="#FF6B00">ZERO</tspan></text>
    <text x="420" y="34" text-anchor="end" font-family="'Inter', sans-serif" font-size="11" fill="#777">PÁGINA 01 • CAPA</text>
  </g>
</svg>
