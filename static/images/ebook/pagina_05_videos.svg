<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 700" width="100%" height="100%">
  <defs>
    <linearGradient id="p5Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141720"/>
      <stop offset="100%" stop-color="#0E1017"/>
    </linearGradient>
  </defs>

  <rect width="500" height="700" rx="12" fill="url(#p5Bg)" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>

  <!-- Top Header -->
  <g transform="translate(40, 45)">
    <text x="0" y="0" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#FF6B00" letter-spacing="1">MÓDULO 05 • DIVULGAÇÃO &amp; CONTEÚDO</text>
    <text x="420" y="0" text-anchor="end" font-family="'Inter', sans-serif" font-size="11" fill="#777">PÁGINA 48</text>
    <line x1="0" y1="12" x2="420" y2="12" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  </g>

  <!-- Title -->
  <g transform="translate(40, 85)">
    <text x="0" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="800" fill="#FFF">20 Ideias de Vídeos para Divulgação</text>
    <text x="0" y="48" font-family="'Inter', sans-serif" font-size="12" fill="#8892B0">Ideias simples para TikTok e Reels gravando apenas o produto com seu celular.</text>
  </g>

  <!-- 4 Sample Video Formats -->
  <g transform="translate(40, 160)">
    <!-- Format 1 -->
    <rect width="420" height="95" rx="8" fill="#1A1E29" stroke="rgba(255,107,0,0.2)"/>
    <rect x="16" y="16" width="36" height="36" rx="6" fill="#FF6B00" fill-opacity="0.15"/>
    <text x="34" y="40" text-anchor="middle" font-size="18">📦</text>
    <text x="64" y="30" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#FFF">01. O Unboxing Satisfatório (ASMR)</text>
    <text x="64" y="48" font-family="'Inter', sans-serif" font-size="11" fill="#8892B0">Grave o corte da fita da caixa, a retirada do plástico bolha e a primeira impressão do produto bem de perto. Sons naturais geram alta retenção.</text>
  </g>

  <g transform="translate(40, 270)">
    <!-- Format 2 -->
    <rect width="420" height="95" rx="8" fill="#1A1E29" stroke="rgba(255,255,255,0.06)"/>
    <rect x="16" y="16" width="36" height="36" rx="6" fill="#FF8A3D" fill-opacity="0.15"/>
    <text x="34" y="40" text-anchor="middle" font-size="18">⚡</text>
    <text x="64" y="30" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#FFF">02. O Teste de Resistência ou Utilidade</text>
    <text x="64" y="48" font-family="'Inter', sans-serif" font-size="11" fill="#8892B0">Mostre o item resolvendo um problema em 5 segundos. Exemplo: limpando algo difícil, organizando uma gaveta ou cabendo em um espaço pequeno.</text>
  </g>

  <g transform="translate(40, 380)">
    <!-- Format 3 -->
    <rect width="420" height="95" rx="8" fill="#1A1E29" stroke="rgba(255,255,255,0.06)"/>
    <rect x="16" y="16" width="36" height="36" rx="6" fill="#FF6B00" fill-opacity="0.15"/>
    <text x="34" y="40" text-anchor="middle" font-size="18">🔍</text>
    <text x="64" y="30" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#FFF">03. Zoom nos Detalhes &amp; Acabamento</text>
    <text x="64" y="48" font-family="'Inter', sans-serif" font-size="11" fill="#8892B0">Com boa luz perto da janela, mostre texturas, costuras, encaixes ou o display. Prova visual elimina o receio de compra do cliente.</text>
  </g>

  <!-- Video Script Tip Box -->
  <g transform="translate(40, 490)">
    <rect width="420" height="130" rx="8" fill="#151822" stroke="rgba(255,255,255,0.05)"/>
    <text x="20" y="28" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#FF8A3D">ESTRUTURA EM 3 PASSOS (SEM APARECER):</text>
    <g transform="translate(20, 42)" font-family="'Inter', sans-serif" font-size="11" fill="#CAD2E0">
      <text x="0" y="16"><tspan fill="#FF6B00" font-weight="bold">Gancho (0-3s):</tspan> "Você sabia que esse detalhe muda tudo no dia a dia?"</text>
      <text x="0" y="38"><tspan fill="#FF6B00" font-weight="bold">Corpo (4-12s):</tspan> Mostre o uso prático com música em alta ao fundo.</text>
      <text x="0" y="60"><tspan fill="#FF6B00" font-weight="bold">Chamada (13-15s):</tspan> "Link disponível na bio com envio rápido pelo correio."</text>
    </g>
  </g>

  <!-- Footer -->
  <g transform="translate(40, 640)">
    <line x1="0" y1="0" x2="420" y2="0" stroke="rgba(255,255,255,0.08)"/>
    <text x="0" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#FFF">VENDA DO <tspan fill="#FF6B00">ZERO</tspan></text>
    <text x="420" y="24" text-anchor="end" font-family="'Inter', sans-serif" font-size="10" fill="#666">GUIA PRÁTICO • SHOPEE &amp; MERCADO LIVRE</text>
  </g>
</svg>
