<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="boxFront" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E28B36"/>
      <stop offset="100%" stop-color="#BF6919"/>
    </linearGradient>
    <linearGradient id="boxSide" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BF6919"/>
      <stop offset="100%" stop-color="#9C5210"/>
    </linearGradient>
    <linearGradient id="boxTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5A451"/>
      <stop offset="100%" stop-color="#D97E29"/>
    </linearGradient>
    <filter id="boxDrop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>
  
  <g filter="url(#boxDrop)" transform="translate(10, 10)">
    <!-- Top Face -->
    <polygon points="50,5 95,28 50,50 5,28" fill="url(#boxTop)"/>
    <!-- Top Tape -->
    <polygon points="45,7 55,12 55,48 45,43" fill="#D29A64" opacity="0.6"/>
    
    <!-- Left Face -->
    <polygon points="5,28 50,50 50,95 5,73" fill="url(#boxFront)"/>
    <!-- Shipping Label -->
    <polygon points="12,38 32,48 32,68 12,58" fill="#FFFFFF" opacity="0.9"/>
    <line x1="16" y1="46" x2="28" y2="52" stroke="#333" stroke-width="2"/>
    <line x1="16" y1="52" x2="28" y2="58" stroke="#333" stroke-width="1.5"/>

    <!-- Right Face -->
    <polygon points="50,50 95,28 95,73 50,95" fill="url(#boxSide)"/>
    <!-- Tape side -->
    <polygon points="50,50 58,46 58,91 50,95" fill="#BF6919" opacity="0.8"/>
  </g>
</svg>
