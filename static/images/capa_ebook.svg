<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 850" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111111"/>
      <stop offset="45%" stop-color="#181A22"/>
      <stop offset="100%" stop-color="#0D0E13"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8A3D"/>
      <stop offset="100%" stop-color="#FF6B00"/>
    </linearGradient>
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF6B00" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FF8A3D" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="600" height="850" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Lines -->
  <g opacity="0.07" stroke="#FFFFFF" stroke-width="1">
    <line x1="60" y1="0" x2="60" y2="850"/>
    <line x1="540" y1="0" x2="540" y2="850"/>
    <line x1="0" y1="120" x2="600" y2="120"/>
    <line x1="0" y1="740" x2="600" y2="740"/>
  </g>

  <!-- Orange Glow Top Right -->
  <circle cx="520" cy="100" r="160" fill="#FF6B00" opacity="0.12" filter="blur(40px)"/>
  <circle cx="100" cy="700" r="140" fill="#FF8A3D" opacity="0.08" filter="blur(40px)"/>

  <!-- Top Header Tag -->
  <g transform="translate(60, 60)">
    <rect width="210" height="34" rx="6" fill="#FF6B00" fill-opacity="0.15" stroke="#FF6B00" stroke-width="1.5"/>
    <circle cx="20" cy="17" r="4" fill="#FF6B00"/>
    <text x="34" y="22" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" fill="#FF8A3D" letter-spacing="1.5">GUIA PRÁTICO PARA INICIANTES</text>
  </g>

  <!-- Platform Chips -->
  <g transform="translate(60, 115)">
    <!-- Shopee Tag -->
    <rect width="105" height="28" rx="6" fill="#EE4D2D" fill-opacity="0.2" stroke="#EE4D2D" stroke-width="1.2"/>
    <text x="52" y="19" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" fill="#FF7A59">SHOPEE</text>
    
    <text x="122" y="19" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#666666">+</text>

    <!-- Mercado Livre Tag -->
    <rect x="145" width="145" height="28" rx="6" fill="#FFE600" fill-opacity="0.18" stroke="#FFE600" stroke-width="1.2"/>
    <text x="217" y="19" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" fill="#FFE600">MERCADO LIVRE</text>
  </g>

  <!-- Title Area -->
  <g transform="translate(60, 200)">
    <text x="0" y="30" font-family="'Plus Jakarta Sans', sans-serif" font-size="34" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">FAÇA SUA</text>
    
    <!-- PRIMEIRA VENDA Highlighting -->
    <rect x="-4" y="48" width="488" height="66" rx="8" fill="url(#orangeGrad)"/>
    <text x="12" y="96" font-family="'Plus Jakarta Sans', sans-serif" font-size="46" font-weight="900" fill="#FFFFFF" letter-spacing="-1">PRIMEIRA VENDA</text>
    
    <text x="0" y="172" font-family="'Plus Jakarta Sans', sans-serif" font-size="44" font-weight="900" fill="#FFFFFF" letter-spacing="-1">DO ZERO</text>
    
    <line x1="0" y1="200" x2="160" y2="200" stroke="#FF6B00" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Visual Central Element: Ecommerce Graphics Vector -->
  <g transform="translate(60, 440)">
    <rect width="480" height="210" rx="14" fill="#151720" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>
    
    <!-- Mini Graphic / Charts -->
    <g transform="translate(30, 30)">
      <text x="0" y="0" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#999">Módulos Essenciais de Operação</text>
      
      <!-- Feature 1 -->
      <g transform="translate(0, 25)">
        <rect width="36" height="36" rx="8" fill="#FF6B00" fill-opacity="0.15"/>
        <text x="18" y="23" text-anchor="middle" font-size="18">📦</text>
        <text x="48" y="16" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#FFF">Escolha de Produtos Lucrativos</text>
        <text x="48" y="32" font-family="'Inter', sans-serif" font-size="11" fill="#777">Critérios de validação e margens seguras</text>
      </g>

      <!-- Feature 2 -->
      <g transform="translate(0, 75)">
        <rect width="36" height="36" rx="8" fill="#FF8A3D" fill-opacity="0.15"/>
        <text x="18" y="23" text-anchor="middle" font-size="18">🏷️</text>
        <text x="48" y="16" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#FFF">Cálculo de Preços &amp; Taxas</text>
        <text x="48" y="32" font-family="'Inter', sans-serif" font-size="11" fill="#777">Sem sustos com comissões das plataformas</text>
      </g>

      <!-- Feature 3 -->
      <g transform="translate(0, 125)">
        <rect width="36" height="36" rx="8" fill="#FF6B00" fill-opacity="0.15"/>
        <text x="18" y="23" text-anchor="middle" font-size="18">📸</text>
        <text x="48" y="16" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#FFF">Anúncios &amp; Fotos pelo Celular</text>
        <text x="48" y="32" font-family="'Inter', sans-serif" font-size="11" fill="#777">Títulos que atraem cliques e geram pedidos</text>
      </g>
    </g>
  </g>

  <!-- Bottom Brand Footer -->
  <g transform="translate(60, 750)">
    <line x1="0" y1="0" x2="480" y2="0" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    
    <g transform="translate(0, 25)">
      <!-- Logo Mark -->
      <rect width="30" height="30" rx="6" fill="#FF6B00"/>
      <path d="M9 7L6 11v11a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V11l-3-4z" fill="none" stroke="#FFF" stroke-width="1.8"/>
      <path d="M6 11h18" stroke="#FFF" stroke-width="1.8"/>
      <path d="M12 14a3 3 0 0 0 6 0" fill="none" stroke="#FFF" stroke-width="1.8"/>
      
      <text x="40" y="16" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="900" fill="#FFFFFF" letter-spacing="1">VENDA DO <tspan fill="#FF6B00">ZERO</tspan></text>
      <text x="40" y="28" font-family="'Inter', sans-serif" font-size="10" font-weight="500" fill="#666666">MÉTODO PRÁTICO PARA O COMÉRCIO ELETRÔNICO</text>
    </g>
    
    <text x="480" y="44" text-anchor="end" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#FF6B00">EDIÇÃO OFICIAL</text>
  </g>
</svg>
